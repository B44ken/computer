<svg width="700" height="160" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg">

  <!-- size: 72 x 48 (3:2) -->
  <!-- inputs y = 12,36 ; output y = 24 -->

  <!-- AND (constant-radius semicircle) -->
  <g transform="translate(30,30)">
    <path d="
      M0 0
      L24 0
      A24 24 0 0 1 24 48
      L0 48
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="48" cy="24" r="4" fill="#000" stroke="#999"/>
    <circle cx="0" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="0" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- NAND -->
  <g transform="translate(130,30)">
    <path d="
      M0 0
      L24 0
      A24 24 0 0 1 24 48
      L0 48
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="54" cy="24" r="6" fill="#000" stroke="#999"/>
    <circle cx="0" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="0" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- OR (gentle curvature, not pointy) -->
  <g transform="translate(230,30)">
    <path d="
      M0 0
      Q16 24 0 48
      L22 48
      Q50 48 56 24
      Q50 0 22 0
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="56" cy="24" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- NOR -->
  <g transform="translate(330,30)">
    <path d="
      M0 0
      Q16 24 0 48
      L22 48
      Q50 48 56 24
      Q50 0 22 0
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="62" cy="24" r="6" fill="#000" stroke="#999"/>
    <circle cx="4" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- XOR -->
  <g transform="translate(430,30)">
    <path d="M-6 0 Q10 24 -6 48" fill="none" stroke="#999"/>
    <path d="
      M0 0
      Q16 24 0 48
      L22 48
      Q50 48 56 24
      Q50 0 22 0
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="56" cy="24" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- XNOR -->
  <g transform="translate(530,30)">
    <path d="M-6 0 Q10 24 -6 48" fill="none" stroke="#999"/>
    <path d="
      M0 0
      Q16 24 0 48
      L22 48
      Q50 48 56 24
      Q50 0 22 0
      Z"
      fill="#000" stroke="#999"/>
    <circle cx="62" cy="24" r="6" fill="#000" stroke="#999"/>
    <circle cx="4" cy="12" r="4" fill="#000" stroke="#999"/>
    <circle cx="4" cy="36" r="4" fill="#000" stroke="#999"/>
  </g>

  <!-- NOT -->
  <g transform="translate(30,100)">
    <path d="M0 0 L48 24 L0 48 Z" fill="#000" stroke="#999"/>
    <circle cx="54" cy="24" r="6" fill="#000" stroke="#999"/>
    <circle cx="0" cy="24" r="4" fill="#000" stroke="#999"/>
  </g>

</svg>
