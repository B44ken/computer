name: gate-computer-bootstrap
on:
  push:
    paths: ['.github/workflows/gate-computer-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save elkjs tsx
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys iverilog
      - name: Export source and tools for local validation
        run: |
          mkdir -p /tmp/gate-tools/bin /tmp/gate-tools/lib /tmp/gate-tools/share
          cp /usr/bin/yosys /usr/bin/yosys-abc /usr/bin/iverilog /usr/bin/vvp /tmp/gate-tools/bin/
          cp -a /usr/share/yosys /tmp/gate-tools/share/
          cp -a /usr/lib/x86_64-linux-gnu/ivl /tmp/gate-tools/lib/
          ldd /usr/bin/yosys /usr/bin/yosys-abc /usr/bin/iverilog /usr/bin/vvp | awk '/=> \// {print $3}' | sort -u | xargs -r cp -L -t /tmp/gate-tools/lib/
          tar --exclude=.git -czf /tmp/gate-workspace.tar.gz .
          tar -czf /tmp/gate-tools.tar.gz -C /tmp gate-tools
      - uses: actions/upload-artifact@v4
        with:
          name: gate-computer-workspace
          path: |
            /tmp/gate-workspace.tar.gz
            /tmp/gate-tools.tar.gz
          retention-days: 3
