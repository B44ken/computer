name: deliver and verify computer course
on:
  push:
    branches: ['feature/build-a-computer-course']
    paths: ['.github/workflows/course-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  course:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-a-computer-course
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checked browser fixes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          patches = json.loads(r'''{
            "components/CircuitBoard.tsx": {"before":"2de41653c8b42904f3071dde3b0f7064e70349a493912b4e7875a1cba9b132f7","after":"0a19a60a090968e255847a4ad133ca819894a7056fe79b411b8a9e7b53d06ef6","edits":[[45,46,"        const svg = ref.current\n        if (!fit || !svg) return\n        let active = true\n"],[47,48,"            if (!active || !svg.isConnected) return\n            const { width, height } = svg.getBoundingClientRect()\n"],[53,55,"        const observer = new ResizeObserver(frame); observer.observe(svg)\n        return () => { active = false; observer.disconnect() }\n"]]},
            "components/gates/core/Gate.tsx": {"before":"d380e0a9eda17c5e8d87d5c80f30a5beec3b992826f79d5edb302bc2da79167c","after":"13ec93cfdfb48e415d4bb32da58d912cf9dcf7892dab570ffd97190b76e35b63","edits":[[7,8,"        <title>{`${n}: ${p.voltage ? 1 : 0}`}</title>\n"]]},
            "test/course.test.ts": {"before":"88f088d790a1ad4e24518389ec6db9a90f5643db14d6b8e454a2230555ec069c","after":"6becff1256ce77e67493d3f6ef79d4c6cd1954049250c088ffb4a8ddaa2cc5fb","edits":[[9,10,"import { Wire,Gate,DFFGate,Memory,NANDGate } from '../components/gates'\n"],[79,79,"\n\ntest('server-rendered native gate pin titles contain one stable text value',()=>{\n    const React=require('react'), {renderToString}=require('react-dom/server')\n    const gate=new NANDGate('nand'), messages:string[]=[]\n    const error=console.error;console.error=(...args:any[])=>messages.push(args.join(' '))\n    try {\n        const html=renderToString(React.createElement('svg',null,React.createElement(gate.view,{gate,width:96,height:96,hover:false})))\n        assert.match(html,/<title>A: 0<\\/title>/)\n        assert.match(html,/<title>Y: 0<\\/title>/)\n        assert.deepEqual(messages,[])\n    } finally {console.error=error}\n})\n"]]}
          }''')
          for name, patch in patches.items():
              path = pathlib.Path(name)
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest == patch['after']: continue
              assert digest == patch['before'], name
              lines = data.decode().splitlines(True)
              for start, end, content in reversed(patch['edits']): lines[start:end] = [content]
              data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == patch['after'], name
              path.write_bytes(data)
              print('verified', name)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*patches],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','fix gate title hydration and stale lab resize callbacks'],check=True)
              subprocess.run(['git','push','origin','HEAD:feature/build-a-computer-course'],check=True)
          PY
      - run: npm install
      - run: npm run test:course
      - run: npm run build -- --webpack
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Exercise actual production pages, wiring, progress and touch
        run: npm run test:course:browser
      - name: Record checked source
        if: always()
        run: |
          mkdir -p .test-artifacts/course-browser
          git rev-parse HEAD > .test-artifacts/course-browser/source-commit.txt
          git ls-files -z components lib course pages test docs tools public | xargs -0 sha256sum > .test-artifacts/course-browser/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-browser-evidence
          path: .test-artifacts/course-browser/
          retention-days: 14
