name: regenerate native computer layouts
on:
  push:
    branches: ['feature/gate-level-stupid-computer']
    paths: ['.github/workflows/native-regenerate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gate-level-stupid-computer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify updated browser test source
        run: echo '3b6c4c7758c11eaa11c92d6f44c9015620f869e16b8e736a63ceec75bc58c48f  tests/test_browser.py' | sha256sum -c
      - run: npm install
      - run: sudo apt-get update -qq && sudo apt-get install -y yosys iverilog
      - run: npm run layout:computer
      - name: Verify regenerated layout hashes
        run: |
          sha256sum -c <<'SUMS'
          76ea80bcdcf8d0ce197db73e8f2d4cb251d3b3d03ced4acd0a301220dffd501d  public/computer/manual.json
          f7afb31218c68f1b5d8a681a95d3f3fd7434102884d69a0019f820b131fb54f5  public/computer/auto.metrics.json
          127f8337910e73681f7e464a924424cdb6096999b66c798562b51126b87b4027  public/computer/auto.json
          77f41a9966be04c2d499f2802f80d151b07a8b3c61a24e8a2e35e856fc154e4a  public/computer/manual.metrics.json
          SUMS
      - run: npm run test:computer && npm run test:rtl
      - run: npm run build
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Test real production pages and native editing
        run: |
          export CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')
          npm run test:browser
      - name: Commit verified generated layouts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/computer/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'regenerate and verify layouts for native Circuit, original Cross and visible MemoryGate'
            git push origin HEAD:feature/gate-level-stupid-computer
          fi
      - name: Record delivered hashes
        if: always()
        run: |
          mkdir -p .test-artifacts/browser
          git ls-files -z components hooks lib pages tests hardware scripts public/computer | xargs -0 sha256sum > .test-artifacts/browser/source.sha256
          git rev-parse HEAD > .test-artifacts/browser/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-computer-checks
          path: |
            .test-artifacts/browser/*
            public/computer/*.metrics.json
          retention-days: 14
