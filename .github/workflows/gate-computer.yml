name: native gate computer
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:computer
      - run: npm run build:computer
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: compare wire-extracted native circuits with the original verilog
        run: |
          iverilog -g2012 -s tb -o build/native-computer/test.vvp verilog/stupid.v verilog/memory.v build/native-computer/computer.v test/native-tb.v
          for f in build/native-computer/program-*.hex; do
            vvp build/native-computer/test.vvp +program="$f" +cycles=256
          done
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:computer:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gate-computer
          path: build/native-computer/
